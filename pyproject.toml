[project]
name = "agent"
version = "0.1.0"
description = "Local AI Coding Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.scripts]
agent = "agent.cli.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
